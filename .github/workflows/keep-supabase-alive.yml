name: Keep Supabase alive

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run a query against the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm install pg@8 --no-save --no-package-lock
          cat > ping.mjs <<'EOF'
          import pg from "pg"

          const client = new pg.Client({ connectionString: process.env.DATABASE_URL })
          await client.connect()
          const result = await client.query('SELECT COUNT(*)::int AS count FROM "Workout"')
          console.log(`Database is awake — ${result.rows[0].count} workouts stored.`)
          await client.end()
          EOF
          node ping.mjs

      - name: Hit the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/Workout?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase REST API responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase REST API request failed (HTTP $status):"
            cat response.txt
            exit 1
          fi
          echo "REST API request succeeded — this is the activity signal Supabase's pause detection actually counts."